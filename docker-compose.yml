services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
      LEADERBOARD_DB_PATH: /app/data/leaderboard.db
    volumes:
      - leaderboard_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  leaderboard_data:
